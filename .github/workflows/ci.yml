name: Frontend CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    env:
      VITE_API_BASE_URL: http://localhost:8080/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check patient translation parity
        run: npm run check:i18n

      - name: Check colour contrast
        run: npm run check:contrast

      - name: Run lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Check public page coverage
        run: npm run test:public -- --coverage --maxWorkers=1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify patient pages in a real browser
        run: npx playwright test e2e/public-patient.spec.js

      - name: Run build
        run: npm run build
