# Shared security headers (DDP-#49 / DKR-02 AC4).
# Included in every block that declares add_header, because nginx does not
# inherit parent add_header directives once a child block declares its own.
#
# TLS 1.2+ and HSTS belong to the production edge (SDS §2.5.3) and are
# deliberately not set here — the container serves plain HTTP internally.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
